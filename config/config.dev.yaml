# Профиль разработки: APP_ENV=dev (значение по умолчанию).
# Накладывается поверх config.yaml; переменные окружения важнее этого файла.
# Секреты здесь не хранятся — только имя переменной с ключом (api_key_env).

app:
  host: 127.0.0.1
  port: 8000

ui:
  host: 127.0.0.1
  port: 7860
  share: false        # локальная разработка: публичная ссылка не нужна

llm:
  timeout_seconds: 60
  max_retries: 1

cache:
  ttl_seconds: 600    # 10 минут — удобно для ручных проверок

logging:
  level: DEBUG        # в разработке полезны подробные логи
  console: true
  file: true
  json_file: true
