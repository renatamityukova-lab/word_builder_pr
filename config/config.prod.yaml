# Профиль эксплуатации: APP_ENV=prod.
# Накладывается поверх config.yaml; переменные окружения важнее этого файла.
# Секреты здесь не хранятся — ключ задаётся только через окружение/секреты CI.

app:
  host: 0.0.0.0        # принимать подключения снаружи контейнера
  port: 8000

ui:
  host: 0.0.0.0
  port: 7860
  share: false

llm:
  timeout_seconds: 30  # быстрее отдаём 503, чем держим клиента
  max_retries: 2       # в prod допускаем один дополнительный повтор

cache:
  ttl_seconds: 3600    # 1 час: меньше обращений к LLM

logging:
  level: INFO
  console: false       # в prod основной канал — JSON-файл с ротацией
  file: true
  json_file: true
